name: Daily Risk Brief

on:
  schedule:
    # Runs at 7:00 AM UTC on weekdays (Mon–Fri)
    - cron: "0 7 * * 1-5"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run risk agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python main.py

      # TODO: add a step to email or Slack the memo output
      # TODO: add a step to commit the memo to outputs/ as an artifact
